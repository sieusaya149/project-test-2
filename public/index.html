<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zalo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-name">Zalo</h1>
      <nav class="app-nav" aria-label="Primary">
        <a href="#chats" class="nav-link is-active">Chats</a>
        <a href="#friends" class="nav-link">Friends</a>
        <a href="#login" class="nav-link">Log in</a>
      </nav>
    </header>

    <main class="app-main">
      <section id="chats" class="panel">
        <h2>Chats</h2>
        <p>Your conversations will appear here.</p>
      </section>
      <section id="friends" class="panel" hidden>
        <h2>Friends</h2>

        <p id="friends-login-prompt" class="field-hint" hidden>
          Log in to see your friends.
        </p>

        <div id="friends-content" hidden>
          <section class="friends-section">
            <h3>Add a friend</h3>
            <form id="friend-request-form" class="auth-form">
              <label class="field-label" for="friend-phone">Phone number</label>
              <input
                id="friend-phone"
                name="phone"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                placeholder="e.g. 0901234567"
                required
              />
              <button type="submit" class="btn btn-primary">Send request</button>
            </form>
            <p id="friend-request-message" class="message" hidden></p>
          </section>

          <section class="friends-section">
            <h3>My friends</h3>
            <ul id="friends-list" class="list"></ul>
          </section>

          <section class="friends-section">
            <h3>Incoming requests</h3>
            <ul id="requests-list" class="list"></ul>
          </section>
        </div>
      </section>
      <section id="login" class="panel" hidden>
        <h2>Log in</h2>

        <div id="login-form">
          <form id="phone-form" class="auth-form">
            <label class="field-label" for="phone">Phone number</label>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="e.g. 0901234567"
              required
            />
            <p class="field-hint">We'll send a 6-digit code to this number.</p>
            <button type="submit" class="btn btn-primary">Request code</button>
          </form>

          <form id="code-form" class="auth-form" hidden>
            <p class="field-hint">
              Enter the 6-digit code for <strong id="code-phone"></strong>.
            </p>
            <label class="field-label" for="code">Verification code</label>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              placeholder="123456"
              required
            />
            <div class="btn-row">
              <button type="submit" class="btn btn-primary">Verify</button>
              <button type="button" id="change-phone" class="btn btn-ghost">
                Change phone
              </button>
            </div>
          </form>

          <p id="login-message" class="message is-error" hidden></p>
          <p id="dev-code-hint" class="dev-hint" hidden>
            Demo code: <strong id="dev-code-value"></strong>
          </p>
        </div>

        <div id="logged-in-view" hidden>
          <p class="logged-in-line">Signed in as <strong id="logged-in-phone"></strong>.</p>
          <button type="button" id="logout" class="btn btn-ghost">Log out</button>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
